    <button class="menu-toggle" (click)="toggleMenu()">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-right" [class.active]="isOpen">
      <ul class="nav-links">
        <li>
          <a [routerLink]="['/']" fragment="projects" (click)="isOpen = false">
            {{ 'NAV_PROJECTS' | translate }}
          </a>
        </li>
        <li>
          <a [routerLink]="['/']" fragment="timeline" (click)="isOpen = false">
            {{ 'NAV_JOURNEY' | translate }}
          </a>
        </li>
        <li>
          <a [routerLink]="['/']" fragment="notes" (click)="isOpen = false">
            {{ 'NAV_NOTES' | translate }}

      <div class="language-switcher">
        <button (click)="switchLanguage('en')">EN</button>

<svg class="trail-container">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <path
    #trail
    class="trail-glow"
    fill="none"
    stroke="#fff"
    stroke-linecap="round"
    filter="url(#glow)"
  />
  <path
    #trail
    class="trail-glow"
    fill="none"
    stroke="#fff"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <path #trail class="trail-core" fill="none" stroke="#0b0b0c" stroke-linecap="round" />
  <path #trail class="trail-core" fill="none" stroke="#0b0b0c" stroke-linecap="round" />
</svg>

<main>
  <router-outlet></router-outlet>
</main>

<footer class="footer">
  <p>{{ 'FOOTER' | translate }}</p>
</footer>
